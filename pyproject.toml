[project]
name = "sanctions-screening"
version = "0.1.0"
description = "Sanctions screening demo: ingest OFAC SDN, normalize, match, decide."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "unidecode>=1.3",
    "rapidfuzz>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanctions_screening"]
