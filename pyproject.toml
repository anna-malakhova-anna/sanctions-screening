[project]
name = "sanctions-screening"
version = "0.1.0"
description = "Sanctions screening demo: ingest OFAC SDN, normalize, match, decide."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "unidecode>=1.3",
    "rapidfuzz>=3.9",
    "pycountry>=26.2.16",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "python-multipart>=0.0.32",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanctions_screening"]
